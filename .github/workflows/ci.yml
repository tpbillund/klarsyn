name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate manifests
        run: npm run validate
      - name: Package
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: klarsyn-zips
          path: release/*.zip
